<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password - Void Food</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  background:#000;
  font-family:Segoe UI,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  color:#fff;
  padding:20px;
}
.box {
  width:360px;
  padding:30px;
  background:#111;
  border-radius:12px;
  box-shadow:0 0 30px rgba(255,217,61,.2);
}
h2 { 
  color:#FFD93D; 
  text-align:center; 
  margin-bottom:10px;
}
.info {
  text-align:center;
  color:#ccc;
  font-size:14px;
  margin-bottom:20px;
}
input {
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:6px;
  background:#1a1a1a;
  color:#fff;
}
button {
  width:100%;
  padding:12px;
  background:linear-gradient(45deg,#FF6B6B,#FFD93D);
  border:none;
  border-radius:30px;
  font-weight:bold;
  color:#fff;
  cursor:pointer;
  margin-top:10px;
  transition:0.3s;
}
button:hover {
  transform:translateY(-2px);
  box-shadow:0 5px 20px rgba(255,107,107,0.4);
}
a { 
  color:#FFD93D; 
  text-decoration:none; 
  font-size:14px;
}
.toggle {
  text-align:center;
  margin-top:15px;
}
</style>
</head>
<body>

<div class="box">
  <h2>Reset Password 🔄</h2>
  <p class="info">Enter your new password below</p>
  
  <input type="password" id="newPass" placeholder="New Password">
  <input type="password" id="confirmPass" placeholder="Confirm Password">
  
  <button onclick="resetPassword()">Reset Password</button>
  
  <div class="toggle">
    <a href="login.html">← Back to Login</a>
  </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');

if (!token) {
  document.body.innerHTML = '<div class="box" style="text-align:center;"><h2>Invalid Link</h2><p style="color:#ccc;">This password reset link is invalid or expired.</p><a href="login.html" style="color:#FFD93D;text-decoration:none;">Go to Login</a></div>';
}

function resetPassword() {
  const pass = document.getElementById('newPass').value;
  const confirm = document.getElementById('confirmPass').value;

  if (!pass || !confirm) {
    alert('Please fill all fields');
    return;
  }

  if (pass !== confirm) {
    alert('Passwords do not match');
    return;
  }

  if (pass.length < 6) {
    alert('Password must be at least 6 characters');
    return;
  }

  const f = new FormData();
  f.append("action", "reset_password");
  f.append("token", token);
  f.append("password", pass);

  fetch("auth.php", {method: "POST", body: f})
    .then(r => r.json())
    .then(d => {
      alert(d.message);
      if(d.status) window.location.href = "login.html";
    });
}
</script>

</body>
</html>
