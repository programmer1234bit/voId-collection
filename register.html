<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Void Food</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        
        .register-container { background: #111; padding: 40px; border-radius: 12px; width: 100%; max-width: 450px; border: 1px solid #333; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        
        .register-header { text-align: center; margin-bottom: 40px; }
        .register-header h1 { color: #FFD93D; font-size: 28px; margin-bottom: 5px; }
        .register-header p { color: #ccc; font-size: 14px; }
        .register-header .icon { font-size: 48px; margin-bottom: 15px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #FFD93D; margin-bottom: 8px; font-weight: 500; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 6px; background: #1a1a1a; color: #fff; font-size: 14px; transition: 0.3s; }
        .form-group input:focus { outline: none; border-color: #FFD93D; box-shadow: 0 0 10px rgba(255,217,61,0.3); }
        
        .register-btn { width: 100%; background: linear-gradient(45deg, #FF6B6B, #FFD93D); color: #fff; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 16px; }
        .register-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255,107,107,0.4); }
        .register-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .message { padding: 12px; border-radius: 6px; margin-bottom: 20px; display: none; }
        .message.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block; }
        .message.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block; }
        .message.loading { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; display: block; }
        
        .login-link { text-align: center; margin-top: 20px; }
        .login-link a { color: #FFD93D; text-decoration: none; font-size: 14px; transition: 0.3s; }
        .login-link a:hover { text-decoration: underline; }
        
        .back-home { text-align: center; margin-top: 10px; }
        .back-home a { color: #999; text-decoration: none; font-size: 13px; transition: 0.3s; }
        .back-home a:hover { color: #ccc; }
        
        .password-strength { margin-top: 5px; font-size: 12px; color: #ccc; }
        .strength-bar { height: 4px; background: #333; border-radius: 2px; margin-top: 5px; overflow: hidden; }
        .strength-fill { height: 100%; width: 0%; transition: all 0.3s; }
    </style>
</head>
<body>

<div class="register-container">
    <div class="register-header">
        <div class="icon">✍️</div>
        <h1>Register</h1>
        <p>Create your account</p>
    </div>

    <div id="message" class="message"></div>

    <form id="registerForm">
        <div class="form-group">
            <label for="email"><i class="fas fa-envelope"></i> Email Address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
        </div>

        <div class="form-group">
            <label for="password"><i class="fas fa-lock"></i> Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••••" onchange="checkPasswordStrength()" required>
            <div class="password-strength">
                <span id="strengthText">Min 6 characters</span>
                <div class="strength-bar">
                    <div class="strength-fill" id="strengthFill"></div>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="confirm"><i class="fas fa-check-circle"></i> Confirm Password</label>
            <input type="password" id="confirm" name="confirm_password" placeholder="••••••••••" required>
        </div>

        <!-- ✅ NEW: Terms and Privacy Checkbox -->
        <div class="form-group" style="margin-bottom: 25px;">
            <div style="display: flex; align-items: flex-start; gap: 12px; padding: 15px; background: #1a1a1a; border-radius: 6px; border-left: 3px solid #FFD93D;">
                <input type="checkbox" id="agreeTerms" name="agreeTerms" required style="width: 20px; height: 20px; cursor: pointer; margin-top: 2px;">
                <label for="agreeTerms" style="color: #ccc; cursor: pointer; line-height: 1.5; margin: 0;">
                    I agree to the <a href="privacy-policy.php" target="_blank" style="color: #FFD93D; text-decoration: underline;">Privacy Policy</a> and 
                    <a href="terms-of-service.php" target="_blank" style="color: #FFD93D; text-decoration: underline;">Terms of Service</a>
                    <span style="color: #FF6B6B;">*</span>
                </label>
            </div>
        </div>

        <button type="submit" class="register-btn" id="registerBtn">✍️ Create Account</button>
    </form>

    <div class="login-link">
        Already have an account? <a href="login.html">Login here</a>
    </div>
    
    <div class="back-home">
        <a href="javascript:history.back()">← Go Back</a> | <a href="index.php">Home</a>
    </div>
</div>

<script>
const form = document.getElementById('registerForm');
const messageDiv = document.getElementById('message');
const registerBtn = document.getElementById('registerBtn');

function showMessage(text, type) {
    messageDiv.textContent = text;
    messageDiv.className = `message ${type}`;
}

// ✅ Check if already logged in and redirect
function checkSession() {
    fetch('check-session.php')
        .then(r => r.json())
        .then(d => {
            if (d.logged_in) {
                window.location.href = 'index.php';
            }
        })
        .catch(err => console.log('Session check failed'));
}

window.addEventListener('load', checkSession);

function checkPasswordStrength() {
    const pwd = document.getElementById('password').value;
    const bar = document.getElementById('strengthFill');
    const text = document.getElementById('strengthText');
    
    if (pwd.length < 6) {
        bar.style.width = '33%';
        bar.style.background = '#FF6B6B';
        text.textContent = 'Weak - Min 6 characters';
    } else if (pwd.length < 10) {
        bar.style.width = '66%';
        bar.style.background = '#FFD93D';
        text.textContent = 'Medium - Good password';
    } else {
        bar.style.width = '100%';
        bar.style.background = '#6BCF7F';
        text.textContent = 'Strong - Excellent!';
    }
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    const agreeTerms = document.getElementById('agreeTerms').checked;
    
    // ✅ Validation with terms check
    if (!email || !password || !confirm) {
        showMessage('❌ All fields required', 'error');
        return;
    }
    
    if (!email.includes('@')) {
        showMessage('❌ Invalid email format', 'error');
        return;
    }
    
    if (password.length < 6) {
        showMessage('❌ Password must be at least 6 characters', 'error');
        return;
    }
    
    if (password !== confirm) {
        showMessage('❌ Passwords do not match', 'error');
        return;
    }
    
    // ✅ Check terms acceptance
    if (!agreeTerms) {
        showMessage('❌ You must accept the Privacy Policy and Terms of Service', 'error');
        return;
    }
    
    showMessage('⏳ Creating account...', 'loading');
    registerBtn.disabled = true;
    
    try {
        const formData = new FormData();
        formData.append('action', 'register');
        formData.append('email', email);
        formData.append('password', password);
        formData.append('confirm_password', confirm);
        
        console.log('📤 Sending registration request...');
        
        const response = await fetch('api.php', {
            method: 'POST',
            body: formData
        });
        
        const text = await response.text();
        console.log('Response:', text);
        
        let data;
        try {
            data = JSON.parse(text);
        } catch (parseError) {
            console.error('Parse error:', parseError);
            showMessage('❌ Server error - please try again', 'error');
            registerBtn.disabled = false;
            return;
        }
        
        if (data.status) {
            showMessage('✅ Account created! Redirecting...', 'success');
            setTimeout(() => {
                window.location.href = data.data.redirect;
            }, 1500);
        } else {
            showMessage('❌ ' + (data.message || 'Registration failed'), 'error');
            registerBtn.disabled = false;
        }
        
    } catch (error) {
        console.error('Fetch error:', error);
        showMessage('❌ Network error', 'error');
        registerBtn.disabled = false;
    }
});
</script>

</body>
</html>
